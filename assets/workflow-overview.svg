<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">syypaper 开题报告助手总流程</title>
  <desc id="desc">从用户提交论文题目开始，经过文献处理、模板和正文结构确认、写作方案确认、成品生成与质量检查的完整流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title{font:700 38px 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#0f172a}
      .subtitle{font:400 20px 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#475569}
      .stage{font:700 17px 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2563eb;letter-spacing:2px}
      .node-title{font:700 21px 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#0f172a}
      .node-body{font:400 17px 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#475569}
      .white-title{font:700 20px 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#ffffff}
      .white-body{font:400 16px 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#e0f2fe}
      .label{font:700 16px 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#92400e}
      .edge{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}
      .edge-dash{fill:none;stroke:#94a3b8;stroke-width:2.5;stroke-dasharray:8 8;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="1120" fill="#ffffff"/>
  <text x="800" y="62" text-anchor="middle" class="title">syypaper 开题报告助手总流程</text>
  <text x="800" y="96" text-anchor="middle" class="subtitle">从最少输入到可编辑 DOCX 的分阶段质量控制</text>

  <text x="105" y="152" class="stage">01  提交课题</text>
  <rect x="105" y="170" width="1390" height="100" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="165" cy="220" r="28" fill="#2563eb"/>
  <text x="165" y="227" text-anchor="middle" class="white-title">1</text>
  <text x="215" y="210" class="node-title">用户提交：学历层次＋论文原标题＋可选参考文献</text>
  <text x="215" y="242" class="node-body">未写学历时默认本科；题目原样保留；特殊数量、比例、年份或格式要求可一并说明</text>

  <path d="M800 270 L800 316" class="edge"/>
  <text x="105" y="335" class="stage">02  确定文献</text>
  <polygon points="800,342 950,410 800,478 650,410" fill="#fff7ed" stroke="#fdba74" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="402" text-anchor="middle" class="node-title">是否提供参考文献？</text>
  <text x="800" y="430" text-anchor="middle" class="node-body">决定文献处理路径</text>

  <path d="M650 410 L380 410 L380 490" class="edge"/>
  <path d="M950 410 L1220 410 L1220 490" class="edge"/>
  <rect x="340" y="386" width="80" height="36" rx="18" fill="#ffedd5"/>
  <text x="380" y="410" text-anchor="middle" class="label">未提供</text>
  <rect x="1180" y="386" width="80" height="36" rx="18" fill="#dcfce7"/>
  <text x="1220" y="410" text-anchor="middle" style="font:700 16px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#166534">已提供</text>

  <rect x="105" y="505" width="550" height="166" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="2" filter="url(#shadow)"/>
  <text x="145" y="545" class="node-title">自动检索模式</text>
  <text x="145" y="580" class="node-body">① 展示检索方案，等待“确认，开始检索”</text>
  <text x="145" y="612" class="node-body">② 联网核验、去重、筛选并锁定编号</text>
  <text x="145" y="644" class="node-body">③ 交付文献清单，再等待用户确认采用</text>

  <rect x="945" y="505" width="550" height="166" rx="20" fill="#f0fdf4" stroke="#86efac" stroke-width="2" filter="url(#shadow)"/>
  <text x="985" y="545" class="node-title">用户文献模式</text>
  <text x="985" y="580" class="node-body">只使用用户给定文献，完成基本书目核验</text>
  <text x="985" y="612" class="node-body">不擅自替换、补充或恢复已删除条目</text>
  <text x="985" y="644" class="node-body">用户提交新版完整清单时，以最新版为准</text>

  <path d="M380 671 L380 715 L800 715" fill="none" stroke="#64748b" stroke-width="3"/>
  <path d="M1220 671 L1220 715 L800 715" fill="none" stroke="#64748b" stroke-width="3"/>
  <path d="M800 715 L800 758" class="edge"/>

  <text x="105" y="754" class="stage">03  确认模板与正文结构</text>
  <rect x="105" y="772" width="1390" height="128" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="135" y="800" width="405" height="72" rx="16" fill="#e0f2fe"/>
  <text x="338" y="829" text-anchor="middle" class="node-title">学校模板模式</text>
  <text x="338" y="856" text-anchor="middle" class="node-body">识别原模板结构并让用户确认</text>
  <rect x="598" y="800" width="405" height="72" rx="16" fill="#f1f5f9"/>
  <text x="800" y="829" text-anchor="middle" class="node-title">通用模板模式</text>
  <text x="800" y="856" text-anchor="middle" class="node-body">展示九部分结构并让用户确认</text>
  <rect x="1060" y="800" width="405" height="72" rx="16" fill="#fef3c7"/>
  <text x="1263" y="829" text-anchor="middle" class="node-title">确认节点</text>
  <text x="1263" y="856" text-anchor="middle" class="node-body">标题、顺序、层级可修改</text>

  <path d="M800 900 L800 936" class="edge"/>
  <text x="105" y="967" class="stage">04  确认方案并生成</text>
  <rect x="105" y="985" width="430" height="90" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="1020" text-anchor="middle" class="node-title">写作方案确认</text>
  <text x="320" y="1050" text-anchor="middle" class="node-body">回复“继续生成”</text>
  <path d="M535 1030 L595 1030" class="edge"/>
  <rect x="600" y="985" width="430" height="90" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
  <text x="815" y="1020" text-anchor="middle" class="node-title">生成开题报告与路线图</text>
  <text x="815" y="1050" text-anchor="middle" class="node-body">写作、排版、嵌图、建立品牌链接</text>
  <path d="M1030 1030 L1090 1030" class="edge"/>
  <rect x="1095" y="985" width="400" height="90" rx="20" fill="#0f766e" filter="url(#shadow)"/>
  <text x="1295" y="1020" text-anchor="middle" class="white-title">逐页渲染检查并交付</text>
  <text x="1295" y="1050" text-anchor="middle" class="white-body">DOCX＋技术路线图＋可选文献资料</text>
</svg>
